main: net.tfminecraft.vehicleframework.VehicleFramework
api-version: '1.21.4'
name: VehicleFramework
version: ${project.version}
author: Drefvelin

depend: [NBTAPI, ModelEngine, ProtocolLib, TLibs]
softdepend: [MythicMobs, CoreProtect]

commands:
  vf:
    useage: /<command>
    description: Vehicle Framework Command

permissions:
  vf.server.use:
    description: Use server-owned vehicles.
    default: op
  vf.admin:
    description: Administer vehicles and ownership.
    default: op
