# Spline tracks and train debug log
# Copied to plugins/VehicleFramework/trains.yml on first run

item-small: ia.tfmc:track_small
item-medium: ia.tfmc:track_medium
item-large: ia.tfmc:track_large
item-layer: m.utils.train_track_layer
item-remover: m.utils.train_track_remover
item-recorder: m.utils.train_track_recorder
item-junction: m.utils.train_track_junction
item-switch: ia.tfmc:railroad_switch
item-track: ia.tfmc:train_track
snap-distance: 3
display-y-offset: 0.51
vehicle-y-offset: 0.51
max-turn-degrees: 35
# Space a moving train needs free of blocks, along each car out to its couplers.
# Width is across the rails, height is from the rail up. Laying track keeps 3 x 3 clear.
# 2.5 high lets trains through stepped 4-high tunnels, where the rail rides up to about
# a block above the floor before each step. Taller parts of the model can show through the roof.
clearance:
  width: 3
  height: 2.5
# After a refused lay, seconds before the same player can try again (0 = no wait).
lay-retry-seconds: 3
# Survival / adventure: seconds between rail removals with the remover (0 = no wait).
# The remover's hotbar slot shows the wait as an item cooldown; early clicks do nothing.
remove-cooldown-seconds: 3
min-lay-distance: 8
# Radius, in blocks, of the bends in a laid stroke. A long stroke bends this tightly
# near its corner or its end and is straight elsewhere; a short one bends tighter to fit,
# down to the sharpest turn max-turn-degrees allows over min-lay-distance.
curve-radius: 32
join-distance: 1.5
min-junction-spacing: 16
max-junction-length: 32
junction-arm-distance: 16
# Railroad switch ItemDisplay at each frog (through / diverge)
switch:
  offset-along: -1.2
  offset-out: 2.4
  offset-y: 0.0
  yaw-inward: 90
  throw-degrees: 90
  throw-degrees-per-second: 90
desired-grade-degrees: 6
max-grade-degrees: 10
# Loaded chunks only. Unloaded track uses this style the next time its chunk loads.
resync-chunks-per-tick: 2

# Cars with behaviour.train.walkable, such as the flat car, have a deck players can stand on.
walkable:
  # Players on a deck move with the train up to this speed, in blocks a tick.
  # The locomotive runs at 0.72, or 0.864 at full overdrive. Faster, the deck slides
  # out from under them. 0 never carries anyone.
  carry-max-speed: 1.0

# Trains that touch on the same track. Closing slower than this, in blocks a second, they
# bump and stop; faster, the locomotive and what it hits explode. The locomotive runs at
# 14.4 at full throttle. 0 explodes on any contact.
collision:
  explode-speed: 3.0

# Warns everyone seated on a train at least this many seconds before it would collide at current speeds:
# oncoming, stopped, slower ahead, catching it from behind, or parked in unloaded chunks.
# Riders of a standing train another is heading for are warned too. Only a locomotive, or a car
# on its own, explodes on contact. A train whose throttle is rising counts as accelerating at
# that rate up to its throttle limit. The first warning flashes a title, then a boss bar counts
# down with the alarm sound.
collision-warning:
  enabled: true
  seconds: 30
  # How often to look ahead, in ticks.
  check-ticks: 10
  # Blocks kept between trains; closer than this counts as running into it.
  margin: 2
  # Unloaded cars only have their centre saved, so count this many blocks either side of it.
  parked-car-half-length: 5
  sound: minecraft:block.bell.use
  sound-volume: 1.0
  sound-pitch: 1.5
  # Half this interval once impact is 10 seconds away or less.
  sound-interval-ticks: 40

# Moving trains: crumbs and clack while rolling. Does not affect layer clicks or placing 1x3s.
fx:
  particle: BLOCK_CRACK
  particle-block: GRAVEL
  count: 3
  width: 3
  extra: 0.06
  y-offset: 0.08
  sound: minecraft:block.stone.break
  sound-volume: 0.35
  sound-pitch: 0.85
  sound-interval-blocks: 2.5

# Survival / adventure: grow the stroke one sample at a time (small -> medium -> large).
# Creative / spectator (or interval-ticks 0) still rebakes the whole stroke at once, with one sound + particles at the end.
# Layer left/right clicks use the same sound and particles.
build:
  interval-ticks: 4
  swing: true
  sound: minecraft:block.gravel.break
  sound-volume: 0.55
  sound-pitch: 0.9
  sound-2: minecraft:block.iron.place
  sound-2-volume: 1.0
  sound-2-pitch: 2.0
  particle: BLOCK_CRACK
  particle-block: GRAVEL
  count: 6
  width: 1
  extra: 0.08
  y-offset: 0.08

# One switch for logs/track.log and logs/recorder.log
debug-logging: false
